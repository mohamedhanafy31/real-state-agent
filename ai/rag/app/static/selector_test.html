<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Selector Test - Real Estate Chatbot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            direction: rtl;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }

        .content {
            padding: 30px;
        }

        .input-section {
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 1.1em;
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus, input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            flex: 1;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #667eea;
            font-size: 1.1em;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results-section {
            margin-top: 30px;
        }

        .result-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }

        .result-card.error {
            border-left-color: #e74c3c;
            background: #fee;
        }

        .result-card.success {
            border-left-color: #27ae60;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .status-badge {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 600;
        }

        .status-success {
            background: #27ae60;
            color: white;
        }

        .status-error {
            background: #e74c3c;
            color: white;
        }

        .code-block {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            margin: 15px 0;
            direction: ltr;
            text-align: left;
        }

        .code-block pre {
            margin: 0;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .units-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .unit-card {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .unit-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .unit-card h4 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .unit-detail {
            margin: 5px 0;
            font-size: 0.95em;
        }

        .unit-detail strong {
            color: #555;
            margin-left: 5px;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
            border-right: 4px solid #e74c3c;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e0e0e0;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
        }

        .example-queries {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .example-queries h3 {
            margin-bottom: 10px;
            color: #333;
        }

        .example-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .example-btn {
            padding: 8px 15px;
            background: white;
            border: 1px solid #667eea;
            color: #667eea;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.2s;
        }

        .example-btn:hover {
            background: #667eea;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧪 Unit Selector Test</h1>
            <p>Test the UnitSelector component with Egyptian Arabic queries</p>
        </div>

        <div class="content">
            <div class="input-section">
                <div class="form-group">
                    <label for="question">السؤال (Question):</label>
                    <input type="text" id="question" placeholder="مثال: عايز شقة بمساحة 150 متر وأقل من 6 مليون" />
                </div>

                <div class="form-group">
                    <label for="maxRows">الحد الأقصى للوحدات (Max Units):</label>
                    <input type="number" id="maxRows" value="10" min="1" max="50" />
                </div>

                <div class="button-group">
                    <button class="btn-primary" onclick="testSelector()">اختبار (Test)</button>
                    <button class="btn-secondary" onclick="clearResults()">مسح النتائج (Clear)</button>
                </div>

                <div class="example-queries">
                    <h3>أمثلة للاستعلامات (Example Queries):</h3>
                    <div class="example-list">
                        <button class="example-btn" onclick="setExample('عايز شقة بمساحة 150 متر وأقل من 6 مليون')">شقة 150م² < 6M</button>
                        <button class="example-btn" onclick="setExample('عايز فيلا بحديقة كبيرة أكتر من 200 متر')">فيلا بحديقة > 200م²</button>
                        <button class="example-btn" onclick="setExample('عايز شقة في الدور الأرضي بحديقة')">شقة أرضي بحديقة</button>
                        <button class="example-btn" onclick="setExample('عايز أرخص شقة متاحة')">أرخص شقة</button>
                        <button class="example-btn" onclick="setExample('عايز شقة سعرها بين 5 مليون و 7 مليون')">سعر 5-7 مليون</button>
                        <button class="example-btn" onclick="setExample('عايز فيلا أو جاردن فيلا بمساحة أكتر من 300 متر')">فيلا > 300م²</button>
                        <button class="example-btn" onclick="setExample('عايز شقة في مبنى 02/L')">مبنى 02/L</button>
                        <button class="example-btn" onclick="setExample('عايز أغلى وحدة متاحة')">أغلى وحدة</button>
                    </div>
                </div>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>جاري المعالجة... (Processing...)</p>
            </div>

            <div class="results-section" id="results"></div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;

        function setExample(query) {
            document.getElementById('question').value = query;
        }

        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }

        async function testSelector() {
            const question = document.getElementById('question').value.trim();
            const maxRows = parseInt(document.getElementById('maxRows').value) || 10;

            if (!question) {
                alert('الرجاء إدخال سؤال (Please enter a question)');
                return;
            }

            // Show loading
            document.getElementById('loading').classList.add('active');
            document.getElementById('results').innerHTML = '';

            try {
                const response = await fetch(`${API_BASE}/selector/test`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        question: question,
                        max_rows: maxRows
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || 'Request failed');
                }

                displayResults(data);

            } catch (error) {
                displayError(error.message);
            } finally {
                document.getElementById('loading').classList.remove('active');
            }
        }

        function displayResults(data) {
            const resultsDiv = document.getElementById('results');
            const cardClass = data.success ? 'success' : 'error';
            const statusClass = data.success ? 'status-success' : 'status-error';
            const statusText = data.success ? 'نجح (Success)' : 'فشل (Failed)';

            let html = `
                <div class="result-card ${cardClass}">
                    <div class="result-header">
                        <h2>النتائج (Results)</h2>
                        <span class="status-badge ${statusClass}">${statusText}</span>
                    </div>

                    <div class="stats">
                        <div class="stat-item">
                            <div class="stat-value">${data.num_units}</div>
                            <div class="stat-label">وحدات (Units)</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">${data.success ? '✓' : '✗'}</div>
                            <div class="stat-label">الحالة (Status)</div>
                        </div>
                    </div>
            `;

            if (data.error) {
                html += `
                    <div class="error-message">
                        <strong>خطأ (Error):</strong> ${data.error}
                    </div>
                `;
            }

            if (data.code) {
                html += `
                    <h3 style="margin-top: 20px; margin-bottom: 10px;">الكود المُنشأ (Generated Code):</h3>
                    <div class="code-block">
                        <pre>${escapeHtml(data.code)}</pre>
                    </div>
                `;
            }

            if (data.units && data.units.length > 0) {
                html += `
                    <h3 style="margin-top: 20px; margin-bottom: 10px;">الوحدات المطابقة (Matching Units):</h3>
                    <div class="units-grid">
                `;

                data.units.forEach(unit => {
                    const code = unit.Code || unit.code || 'N/A';
                    const price = formatNumber(unit.Price || unit.price || 0);
                    const area = unit.Area || unit.area || 'N/A';
                    const usage = unit.Usage || unit.usage || 'N/A';
                    const floor = unit.Floor || unit.floor || 'N/A';
                    const building = unit.Building || unit.building || 'N/A';
                    const garden = unit.Garden || unit.garden || 0;
                    const roof = unit.Roof || unit.roof || 0;

                    html += `
                        <div class="unit-card">
                            <h4>${code}</h4>
                            <div class="unit-detail"><strong>السعر:</strong> ${price} EGP</div>
                            <div class="unit-detail"><strong>المساحة:</strong> ${area} م²</div>
                            <div class="unit-detail"><strong>النوع:</strong> ${usage}</div>
                            <div class="unit-detail"><strong>الدور:</strong> ${floor}</div>
                            <div class="unit-detail"><strong>المبنى:</strong> ${building}</div>
                            ${garden > 0 ? `<div class="unit-detail"><strong>الحديقة:</strong> ${garden} م²</div>` : ''}
                            ${roof > 0 ? `<div class="unit-detail"><strong>الروف:</strong> ${roof} م²</div>` : ''}
                        </div>
                    `;
                });

                html += `</div>`;
            } else if (data.success) {
                html += `
                    <div style="padding: 20px; text-align: center; color: #666;">
                        لا توجد وحدات مطابقة (No matching units found)
                    </div>
                `;
            }

            html += `</div>`;
            resultsDiv.innerHTML = html;
        }

        function displayError(message) {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = `
                <div class="result-card error">
                    <div class="result-header">
                        <h2>خطأ (Error)</h2>
                        <span class="status-badge status-error">فشل (Failed)</span>
                    </div>
                    <div class="error-message">
                        ${escapeHtml(message)}
                    </div>
                </div>
            `;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatNumber(num) {
            if (typeof num === 'number') {
                return num.toLocaleString('en-US');
            }
            return num;
        }

        // Allow Enter key to submit
        document.getElementById('question').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                testSelector();
            }
        });
    </script>
</body>
</html>
