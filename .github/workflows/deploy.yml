name: Deploy Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: meta-478212
  REGION: us-central1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Google Cloud auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Detect changed services
        id: changes
        run: |
          set -euo pipefail

          # Default: deploy everything (e.g. first run, manual dispatch)
          DEPLOY_FRONTEND=1
          DEPLOY_RAG=1
          DEPLOY_ORCH=1

          if [[ "${GITHUB_EVENT_NAME}" == "push" && -n "${GITHUB_SHA:-}" ]]; then
            BASE_SHA="${GITHUB_EVENT_BEFORE:-}"
            if [[ -z "${BASE_SHA}" || "${BASE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
              BASE_SHA="HEAD~1"
            fi

            echo "Comparing changes between ${BASE_SHA} and ${GITHUB_SHA}"
            CHANGED_FILES="$(git diff --name-only "${BASE_SHA}" "${GITHUB_SHA}")"

            DEPLOY_FRONTEND=0
            DEPLOY_RAG=0
            DEPLOY_ORCH=0

            if echo "${CHANGED_FILES}" | grep -E '^Ai-P/|^scripts/deploy_cloud_run\.sh' >/dev/null; then
              DEPLOY_FRONTEND=1
            fi
            if echo "${CHANGED_FILES}" | grep -E '^ai/rag/|^scripts/deploy_cloud_run\.sh' >/dev/null; then
              DEPLOY_RAG=1
            fi
            if echo "${CHANGED_FILES}" | grep -E '^ai/orchestrator/|^scripts/deploy_cloud_run\.sh' >/dev/null; then
              DEPLOY_ORCH=1
            fi
          fi

          echo "DEPLOY_FRONTEND=${DEPLOY_FRONTEND}" >> "$GITHUB_ENV"
          echo "DEPLOY_RAG=${DEPLOY_RAG}" >> "$GITHUB_ENV"
          echo "DEPLOY_ORCH=${DEPLOY_ORCH}" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ASR_API_URL: ${{ secrets.ASR_API_URL }}
          TTS_API_URL: ${{ secrets.TTS_API_URL }}
          PROJECT_ID: ${{ env.PROJECT_ID }}
          REGION: ${{ env.REGION }}
          DEPLOY_FRONTEND: ${{ env.DEPLOY_FRONTEND }}
          DEPLOY_RAG: ${{ env.DEPLOY_RAG }}
          DEPLOY_ORCH: ${{ env.DEPLOY_ORCH }}
          UPDATE_GITHUB_SECRETS: "0"
        run: |
          chmod +x scripts/deploy_cloud_run.sh
          ./scripts/deploy_cloud_run.sh

