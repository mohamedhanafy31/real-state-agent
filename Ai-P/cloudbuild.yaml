steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'NEXT_PUBLIC_ORCHESTRATOR_URL=${_NEXT_PUBLIC_ORCHESTRATOR_URL}'
      - '--build-arg'
      - 'NEXT_PUBLIC_WS_URL=${_NEXT_PUBLIC_WS_URL}'
      - '--tag'
      - '${_IMAGE_NAME}'
      - '.'
    id: 'build-frontend'
  
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_IMAGE_NAME}'
    id: 'push-frontend'

images:
  - '${_IMAGE_NAME}'

substitutions:
  _NEXT_PUBLIC_ORCHESTRATOR_URL: ''
  _NEXT_PUBLIC_WS_URL: ''
  _IMAGE_NAME: ''

