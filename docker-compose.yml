version: "3.9"

services:
  frontend:
    build:
      context: ./Ai-P
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_ORCHESTRATOR_URL=${NEXT_PUBLIC_ORCHESTRATOR_URL:-http://localhost:8040}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:8040/ws/voice}
      - NEXT_PUBLIC_ORCHESTRATOR_TOKEN=${NEXT_PUBLIC_ORCHESTRATOR_TOKEN:-dev-token}
    ports:
      - "3000:3000"
    depends_on:
      orchestrator:
        condition: service_started
    networks:
      - app-net

  rag:
    build:
      context: ./ai/rag
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - LOG_DIR=/app/logs
      - LOG_LEVEL=${RAG_LOG_LEVEL:-INFO}
    volumes:
      - ./ai/rag/logs:/app/logs
      - ./data:/app/data
      - ~/.cache/huggingface:/root/.cache/huggingface
    ports:
      - "8000:8000"
    networks:
      - app-net

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6383:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-net

  orchestrator:
    build:
      context: ./ai/orchestrator
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RAG_API_URL=http://rag:8000
      - ASR_API_URL=${ASR_API_URL:-https://arabic-asr-api-22251281831.us-central1.run.app}
      - ASR_STREAMING_WS_URL=${ASR_STREAMING_WS_URL:-wss://arabic-asr-api-22251281831.us-central1.run.app/ws/asr-stream}
      - ASR_STREAMING_CONNECT_TIMEOUT=${ASR_STREAMING_CONNECT_TIMEOUT:-10}
      - ASR_STREAMING_RESULT_TIMEOUT=${ASR_STREAMING_RESULT_TIMEOUT:-15}
      - TTS_API_URL=${TTS_API_URL:-https://arabic-tts-api-22251281831.us-central1.run.app}
      - HOST=0.0.0.0
      - PORT=8040
      - LOG_LEVEL=${ORCHESTRATOR_LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - JWT_SECRET=${JWT_SECRET:-change-me}
    depends_on:
      redis:
        condition: service_healthy
      rag:
        condition: service_started
    ports:
      - "8040:8040"
    volumes:
      - ./ai/orchestrator/logs:/app/logs
    networks:
      - app-net

networks:
  app-net:
    driver: bridge

volumes:
  redis_data:

